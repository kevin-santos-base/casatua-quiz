services:
  - type: web
    name: casatua-quiz
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5
      - key: MAX_TOKENS
        value: "4000"
      - key: PYTHON_VERSION
        value: "3.11.9"
